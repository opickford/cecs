name: Windows Release CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download CHDS release
        run: |
          curl -L -o chds-v0.1.0.zip https://github.com/opickford/chds/releases/download/v0.1.0/chds-v0.1.0.zip
          powershell -Command "Expand-Archive chds-v0.1.0.zip -DestinationPath libs\chds"

      - name: Debug unzip
        run: dir libs\chds /s

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/libs"

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest -C Release --test-dir build --output-on-failure